<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <title>Anicann - Contacto</title>
    <link rel="stylesheet" href="css/styles.min.css">

    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  </head>
  <body class="contacto">
    <header class="header">
      <div class="container">
        <div class="row">
          <div class="col-6 col-lg-2 header--logo"><a href="./"><img class="img-fluid" id="header--logo" src="../img/logo-anicann.png" alt="Anicann"></a></div>
          <div class="col-6 header--navegacion d-lg-none">
            <nav class="navbar-expand-lg">
              <div class="btn" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation"></div>
            </nav>
          </div>
          <div class="col-12 col-lg-10 d-lg-flex">
            <div class="collapse navbar-collapse d-lg-block" id="navbarNav">
              <ul>
                <li><a href="noticias.html">Noticias</a></li>
                <li> <a href="multimedia.html">Multimedia</a></li>
                <li> <a href="reporte-verde.html">Reporte Verde</a></li>
                <li> <a href="articulos.html">Artículos</a></li>
                <li class="menuActivo"> <a href="contacto.html">Contacto</a></li>
                <li id="navbarNav--redes"><a href="#!"><img src="../../img/icon-facebook.svg" alt=""></a><a href="#!"><img src="../../img/icon-twitter.svg" alt=""></a><a href="#!"><img src="../../img/icon-instagram.svg" alt=""></a></li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </header>
    <div class="mancha" id="mancha1"><img class="img-fluid mancha1" src="../img/mancha1.svg" alt=""><img class="img-fluid mancha2" src="../img/mancha2.svg" alt=""></div>
    <div class="mancha" id="mancha2"><img class="img-fluid mancha1" src="../img/mancha1.svg" alt=""><img class="img-fluid mancha2" src="../img/mancha2.svg" alt=""></div>
    <section class="contacto--section">
      <div class="mancha" id="mancha3"><img class="img-fluid mancha1" src="../img/mancha1.svg" alt=""><img class="img-fluid mancha2" src="../img/mancha2.svg" alt=""></div>
      <div class="container"> 
        <div class="row justify-content-end">
          <div class="col-12 col-lg-7">
            <h1> <b>Contacto</b></h1>
          </div>
        </div>
        <div class="row justify-content-center">
          <div class="col-12 col-lg-7 contacto--section--form">
            <form id="form-contacto">
              <div class="cajaInput">
                <input class="input" id="input-name" type="text" name="" placeholder="Nombre">
              </div>
              <div class="cajaInput">
                <input class="input" id="input-apellido" type="text" name="" placeholder="Apellido">
              </div>
              <div class="cajaInput">
                <input class="input" id="input-edad" type="text" name="" placeholder="Edad">
              </div>
              <div class="cajaInput">
                <input class="input" id="input-email" type="text" name="" placeholder="Email">
              </div>
              <div class="cajaInput">
                <textarea class="input" id="input-comentarios" placeholder="Comentarios"></textarea>
              </div>
              <input class="boton boton-on" id="boton-enviar-contacto" type="button" value="Enviar">
            </form>
          </div>
          <div class="col-12 col-lg-5 contacto--section--back"><img class="img-fluid" src="../img/back-contacto.png" alt=""></div>
        </div>
        <div class="row">
          <div class="col-12 contacto--section--organigrama">
            <h2>ORGANIGRAMA</h2>
          </div>
        </div>
      </div>
    </section>
    <footer class="footer">
      <div class="container">
        <div class="row">
          <div class="col-12">
            <h6 class="h6-min">Copyright ©</h6>
          </div>
        </div>
      </div>
    </footer>
